<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AngularJS Registration Form</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.4.7/angular.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.4.7/angular-route.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('https://png.pngtree.com/thumb_back/fw800/background/20230720/pngtree-3d-rendering-of-cafe-interior-design-and-wall-decor-image_3698483.jpg');
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 115vh;
        }
        .main {
            background-color: hsl(0, 0%, 100%);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 400px;
        }
        .main h1 {
            color: rgb(29, 196, 87);
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #dddddd;
            border-radius: 5px;
        }
        button[type="submit"] {
            padding: 15px;
            border-radius: 10px;
            border: none;
            background-color: #61af4c;
            color: white;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button[type="button"] {
            padding: 1px;
            border-radius: 10px;
            border: none;
            background-color: #ecf0eb;
            color: white;
            cursor: pointer;
            width: 10%;
            font-size: 16px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 12px;
            cursor: pointer;
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>
    
    <div ng-view></div>

    <script>
        
        var app = angular.module('myApp', ['ngRoute']);

        app.config(function($routeProvider) {
            $routeProvider
                .when('/', {
                    templateUrl: 'home.html',
                    controller: 'HomeController'
                })
                .when('/register', {
                    templateUrl: 'registration.html',
                    controller: 'RegistrationController'
                })
                .when('/login', {
                    templateUrl: 'login.html',
                    controller: 'LoginController'
                })
                .otherwise({
                    redirectTo: '/'
                });
        });

        app.controller('HomeController', function($scope) {
            $scope.message = "Welcome to the Delight Cafe!";
        });

        
        app.controller('RegistrationController', function($scope, $location) {
            $scope.registration = {
                first: '',
                last: '',
                email: '',
                password: '',
                repassword: '',
                mobile: '',
                gender: 'male'
            };

            
            $scope.togglePassword = function(id) {
                var passwordField = document.getElementById(id);
                var type = passwordField.type === "password" ? "text" : "password";
                passwordField.type = type;
            };

            
            $scope.submitForm = function() {
                if ($scope.registration.password !== $scope.registration.repassword) {
                    alert("Passwords do not match.");
                    return;
                }
                console.log("Registration data:", $scope.registration);
                alert("Registration successful!");
                $location.path('/login');
            };
        });

        
        app.controller('LoginController', function($scope, $location) {
            $scope.login = {
                username: '',
                password: ''
            };


            $scope.togglePassword = function(id) {
                var passwordField = document.getElementById(id);
                var type = passwordField.type === "password" ? "text" : "password";
                passwordField.type = type;
            };

            
            $scope.submitLogin = function() {
                if ($scope.login.username && $scope.login.password) {
                    console.log("Login data:", $scope.login);
                    alert("Login successful!");
                    $location.path('/');
                } else {
                    alert("Please fill in both fields!");
                }
            };
        });
    </script>

    
    <script type="text/ng-template" id="home.html">
        <div class="main">
            <h1>{{ message }}</h1>
            <p>Welcome to our site! <a href="#/register">Register here</a> to get started.</p>
        </div>
    </script>

    
    <script type="text/ng-template" id="registration.html">
        <div class="main">
            <h1>Registration Form</h1>
            <form ng-submit="submitForm()">
                <label for="first">First Name:</label>
                <input type="text" id="first" ng-model="registration.first" required />

                <label for="last">Last Name:</label>
                <input type="text" id="last" ng-model="registration.last" required />

                <label for="email">Email:</label>
                <input type="email" id="email" ng-model="registration.email" required />

                <label for="password">Password:</label>
                <div style="position: relative;">
                    <input type="password" id="password" ng-model="registration.password"
                        pattern="^(?=.*\d)(?=.*[a-zA-Z])(?=.*[^a-zA-Z0-9])\S{8,}$"
                        title="Password must contain at least one number, one alphabet, one symbol, and be at least 8 characters long" required />
                    <button type="button" class="toggle-password" ng-click="togglePassword('password')">👁️</button>
                </div>

                <label for="repassword">Confirm Password:</label>
                <div style="position: relative;">
                    <input type="password" id="repassword" ng-model="registration.repassword" required />
                    <button type="button" class="toggle-password" ng-click="togglePassword('repassword')">👁️</button>
                </div>

                <label for="mobile">Contact:</label>
                <input type="text" id="mobile" ng-model="registration.mobile" maxlength="10" required />

                <label for="gender">Gender:</label>
                <select id="gender" ng-model="registration.gender" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <button type="submit">Submit</button>
            </form>
            <center>
                <span class="psw">Already have an account? <a href="#/login">Login here</a></span>
            </center>
        </div>
    </script>

    
    <script type="text/ng-template" id="login.html">
        <form action="homee.html" method="POST">
        <div class="main">
            <h1>Login Form</h1>
            <form ng-submit="submitLogin()">
                <label for="username">Username:</label>
                <input type="text" id="username" ng-model="login.username" required />

                <label for="password">Password:</label>
                <div style="position: relative;">
                    <input type="password" id="password" ng-model="login.password" required />
                    <button type="button" class="toggle-password" ng-click="togglePassword('password')">👁️</button>
                </div>

                <button type="submit">Login</button>
            </form>
        </div>
    </script>
</body>
</html>
