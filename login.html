<html>
<head>
    <title>HTML Login Form</title>
    <style>
    body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    background: #f3f3f3;
    flex-direction: column;
    margin: 0;
    background-image: url('https://cdn.choosechicago.com/uploads/2022/11/2-0200-scaled-e1668009159934-2048x988.jpg');    
}
.main { 
    background-color: #fff;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    padding: 10px 20px;
    transition: transform 0.2s;
    width: 500px;
    text-align: center;
}
h1 {
    color: #4CAF50;
}
label {
    display: block;
    width: 100%;
    margin-top: 5px;
    margin-bottom:5px;
    text-align: left;
    color: #555;
    font-weight: bold;
}
input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #dddddd;
            border-radius: 1px;
        }
button {
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    margin-bottom: 15px;
    border: none;
    color: white;
    cursor: pointer;
    background-color: #4CAF50;
    width: 100%;
    font-size: 16px;
}
button[type="button"] {
            padding: 2px;
            border-radius: 10px;
            border: none;
            background-color: #ecf0eb;
            color: white;
            cursor: pointer;
            width: 5%;
            font-size: 16px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 12px;
            cursor: pointer;
            background: transparent;
            border: none;
        }
.wrap {
    display: flex;
    justify-content: center;
    align-items: center;
}
</style>
</head>
<body>
    <div class="main">
        <h1>LOGIN FROM</h1>
        <h3>Enter Your Login Information</h3>
        <form action="/login" method="POST">

            <label for="first">
                Username:
            </label>
            <input type="text" id="first" name="first" 
                placeholder="Enter your Username" required>
<br>
<label for="password">Password:</label>
<div style="position: relative;">
    <input type="password" id="password" name="password"
           pattern="^(?=.*\d)(?=.*[a-zA-Z])(?=.*[^a-zA-Z0-9])\S{8,}$" 
           title="Password must contain at least one number, 
                   one alphabet, one symbol, and be at 
                   least 8 characters long" required />
    <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
</div>
<label for="Confirm password">Confirm Password:</label>
<div style="position: relative;">
    <input type="password" id="repassword" name="repassword" required />
    <button type="button" class="toggle-password" onclick="togglePassword('repassword')">👁️</button>
</div>
<br>
            <div class="wrap">
                <button type="submit">
                    Submit
                </button>
            </div>
        </form>
        <p>Not registered?
            <a href="#" style="text-decoration: none;">
                Create an account
            </a>
        </p>
    </div>
</body>
</html>
