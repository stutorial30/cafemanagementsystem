<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.4.7/angular.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.4.7/angular-route.min.js">
    </script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="js/app.js"></script>
    <title>HTML Registration Form</title>
    </head>
    <body ng-app="myApp">
    <style>
        body {
            background-image: url('https://png.pngtree.com/thumb_back/fw800/background/20230720/pngtree-3d-rendering-of-cafe-interior-design-and-wall-decor-image_3698483.jpg');
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .main {
            background-color: hsl(0, 0%, 100%);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 300px;
        }
        .main h1 {
            color: rgb(29, 196, 87);
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #dddddd;
            border-radius: 5px;
        }
        button[type="submit"] {
            padding: 15px;
            border-radius: 10px;
            border: none;
            background-color: #61af4c;
            color: white;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button[type="button"] {
            padding: 1px;
            border-radius: 10px;
            border: none;
            background-color: #ecf0eb;
            color: white;
            cursor: pointer;
            width: 10%;
            font-size: 16px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 12px;
            cursor: pointer;
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>Registration Form</h1>
          <form action="/register" method="post">
            <label for="first">First Name:</label>
            <input type="text" id="first" name="first" required />
            <label for="last">Last Name:</label>
            <input type="text" id="last" name="last" required />
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
            <label for="password">Password:</label>
            <div style="position: relative;">
                <input type="password" id="password" name="password"
                       pattern="^(?=.*\d)(?=.*[a-zA-Z])(?=.*[^a-zA-Z0-9])\S{8,}$" 
                       title="Password must contain at least one number, 
                               one alphabet, one symbol, and be at 
                               least 8 characters long" required />
                <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
            </div>
            <label for="Confirm password">Confirm Password:</label>
            <div style="position: relative;">
                <input type="password" id="repassword" name="repassword" required />
                <button type="button" class="toggle-password" onclick="togglePassword('repassword')">👁️</button>
            </div>
            <label for="mobile">Contact:</label>
            <input type="text" id="mobile" name="mobile" maxlength="10" required />
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="male">
                    Male
                </option>
                <option value="female">
                    Female
                </option>
                <option value="other">
                    Other
                </option>
            </select>
      <button type="submit" >
                Submit
            </button>
        </form>
         <a href="/login.html" >login </a> 
            <center> <span class="psw"> <a href="#">Forgot password?</a></span></center>
        </div>
    </div>
    <script>
        function togglePassword(id) {
            const passwordField = document.getElementById(id);
            const type = passwordField.type === "password" ? "text" : "password";
            passwordField.type = type;
        }
    </script>
</body>
</html>
